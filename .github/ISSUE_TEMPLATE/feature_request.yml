name: Feature request
description: Propose a focused improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should pqty address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and compatibility
      description: Note effects on Artifact Protocol, registry behavior, platforms, or trust boundaries.
