name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit from main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release metadata
        id: metadata
        shell: bash
        run: |
          version="$(cargo pkgid --package pqty | sed -E 's/.*[@#]([^@#]+)$/\1/')"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]]
          fi
          ./scripts/verify-release-metadata.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify crates.io packages
        run: |
          cargo publish --dry-run --package pqty-fls --locked
          cargo publish --dry-run --package pqty --locked

  archives:
    name: Archive (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cross: false
            windows: false
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            cross: true
            windows: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            cross: false
            windows: false
          - runner: macos-15
            target: aarch64-apple-darwin
            cross: false
            windows: false
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            cross: false
            windows: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Install ARM64 smoke-test runtime
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            qemu-user-static \
            libc6-arm64-cross \
            libgcc-s1-arm64-cross

      - name: Build with cross
        if: matrix.cross
        run: cross build --workspace --release --locked --target ${{ matrix.target }}

      - name: Build natively
        if: ${{ matrix.cross == false }}
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package and smoke-test Unix archive
        if: ${{ matrix.windows == false }}
        shell: bash
        run: |
          set -euo pipefail
          package="pqty-${{ needs.verify.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/pqty" "dist/$package/"
          cp "target/${{ matrix.target }}/release/pqty-fls" "dist/$package/"
          cp LICENSE README.md "dist/$package/"
          cp -R schemas "dist/$package/"
          cp -R docs "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          mkdir -p dist/smoke
          tar -C dist/smoke -xzf "dist/$package.tar.gz"
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            pqty_command=(
              qemu-aarch64-static
              -L /usr/aarch64-linux-gnu
              "dist/smoke/$package/pqty"
            )
            "${pqty_command[@]}" --version
            qemu-aarch64-static -L /usr/aarch64-linux-gnu \
              "dist/smoke/$package/pqty-fls" --version
          else
            pqty_command=("dist/smoke/$package/pqty")
            "${pqty_command[@]}" --version
            "dist/smoke/$package/pqty-fls" --version
          fi
          fixture="$PWD/tests/fixtures/archive-smoke"
          smoke_work="$(mktemp -d)"
          "${pqty_command[@]}" --no-config lock "$fixture/main.tex" \
            --tlpdb "$fixture/tlpkg/texlive.tlpdb" \
            --store "$smoke_work/store" \
            --output "$smoke_work/pqty.lock"
          "${pqty_command[@]}" --no-config install \
            --lock "$smoke_work/pqty.lock" \
            --store "$smoke_work/store" \
            --out "$smoke_work/texmf" \
            --link copy
          cmp \
            "$fixture/texmf-dist/tex/latex/foo/foo.sty" \
            "$smoke_work/texmf/tex/latex/foo/foo.sty"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$package.tar.gz" >"$package.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$package.tar.gz" >"$package.tar.gz.sha256")
          fi

      - name: Package and smoke-test Windows archive
        if: matrix.windows
        shell: pwsh
        run: |
          $package = "pqty-${{ needs.verify.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pqty.exe" "dist/$package/"
          Copy-Item "target/${{ matrix.target }}/release/pqty-fls.exe" "dist/$package/"
          Copy-Item LICENSE, README.md "dist/$package/"
          Copy-Item -Recurse schemas "dist/$package/"
          Copy-Item -Recurse docs "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          Expand-Archive "dist/$package.zip" -DestinationPath "dist/smoke"
          & "dist/smoke/$package/pqty.exe" --version
          & "dist/smoke/$package/pqty-fls.exe" --version
          $fixture = (Resolve-Path "tests/fixtures/archive-smoke").Path
          $smokeWork = Join-Path ([System.IO.Path]::GetTempPath()) "pqty-archive-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Force $smokeWork | Out-Null
          & "dist/smoke/$package/pqty.exe" --no-config lock "$fixture/main.tex" `
            --tlpdb "$fixture/tlpkg/texlive.tlpdb" `
            --store "$smokeWork/store" `
            --output "$smokeWork/pqty.lock"
          if ($LASTEXITCODE -ne 0) { throw "packaged pqty lock smoke failed" }
          & "dist/smoke/$package/pqty.exe" --no-config install `
            --lock "$smokeWork/pqty.lock" `
            --store "$smokeWork/store" `
            --out "$smokeWork/texmf" `
            --link copy
          if ($LASTEXITCODE -ne 0) { throw "packaged pqty install smoke failed" }
          $expected = (Get-FileHash "$fixture/texmf-dist/tex/latex/foo/foo.sty" -Algorithm SHA256).Hash
          $actual = (Get-FileHash "$smokeWork/texmf/tex/latex/foo/foo.sty" -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "packaged pqty installed different bytes" }
          $hash = (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $package.zip" | Set-Content "dist/$package.zip.sha256"

      - name: Upload checksummed archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  crates:
    name: Publish crates
    if: startsWith(github.ref, 'refs/tags/v')
    needs: archives
    runs-on: ubuntu-24.04
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish pqty-fls
        run: ./scripts/publish-crate.sh pqty-fls "${GITHUB_REF_NAME#v}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

      - name: Publish pqty
        run: ./scripts/publish-crate.sh pqty "${GITHUB_REF_NAME#v}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - archives
      - crates
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload \
            "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/SHA256SUMS

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
