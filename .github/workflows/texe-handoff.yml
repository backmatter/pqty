name: Texe release handoff

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable pqty tag to verify
        required: true
        type: string
      dispatch:
        description: Also dispatch to texe after verifying access
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dispatch:
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: texe-handoff-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  handoff:
    if: github.repository == 'backmatter/pqty'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PQTY_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$PQTY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$PQTY_TAG" --repo backmatter/pqty --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true

      - name: Verify release-app access to texe
        id: texe-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: texe
          permission-contents: write

      - name: Request a tested texe suite update
        if: inputs.dispatch
        env:
          GH_TOKEN: ${{ steps.texe-token.outputs.token }}
        shell: bash
        run: |
          jq -n --arg tag "$PQTY_TAG" \
            '{event_type:"pqty-release",client_payload:{tag:$tag}}' > "$RUNNER_TEMP/pqty-release.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY_OWNER/texe/dispatches" \
            --input "$RUNNER_TEMP/pqty-release.json"
          echo "Dispatched $PQTY_TAG to texe suite validation." >> "$GITHUB_STEP_SUMMARY"

      - name: Report verified access
        if: ${{ !inputs.dispatch }}
        run: echo 'Verified the existing pqty release app can create a Contents-write token scoped to texe. No dependency update was dispatched.' >> "$GITHUB_STEP_SUMMARY"
