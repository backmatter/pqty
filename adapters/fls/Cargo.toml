[package]
name = "pqty-fls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Convert TeX recorder .fls files into engine-neutral pqty input traces"
readme = "README.md"
documentation = "https://docs.rs/pqty-fls"
keywords = ["latex", "tex", "recorder", "pqty"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "tests/**", "/README.md", "/LICENSE", "/Cargo.lock"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
