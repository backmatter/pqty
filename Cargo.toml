[workspace]
members = [".", "adapters/fls", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
homepage = "https://github.com/backmatter/pqty"
repository = "https://github.com/backmatter/pqty"

[package]
name = "pqty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Engine-independent dependency and environment manager for LaTeX"
readme = "README.md"
documentation = "https://docs.rs/pqty"
keywords = ["latex", "tex", "package-manager", "reproducible"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "src/**",
    "corpus/README.md",
    "schemas/**",
    "docs/**",
    "tests/**",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/SECURITY.md",
    "/LICENSE",
    "/Cargo.lock",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
ureq = "3"
url = "2"
lzma-rs = "0.3"
tar = "0.4"
toml = "0.8"

[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
